name: Crypto smoke

on:
  push:
    branches:
      - main
      - 'hormozi/**'
  pull_request:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: crypto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Unit tests
        run: pytest -q tests/test_crypto_strategy.py tests/test_okx_client.py
      - name: Public OKX smoke test
        run: python -m cli.crypto status
      - name: Deterministic backtest smoke test
        run: |
          python - <<'PY'
          from tradingagents.crypto.strategy import backtest_ohlcv
          candles = []
          price = 100.0
          for i in range(120):
              price += 0.2
              candles.append({
                  "ts": i,
                  "open": price - 0.1,
                  "high": price + 0.2,
                  "low": price - 0.2,
                  "close": price,
                  "volume": 1000 + i,
              })
          result = backtest_ohlcv(candles)
          assert result["status"] == "ok"
          assert result["fees_included"] is True
          print(result)
          PY
